[project]
name = "hallm"
version = "0.1.0"
description = "Four-arm weight-sharing comparison harness (none / ALBERT cross-layer / HaLViT W+Wᵀ intra-layer / both) for small GPT-style language models — ITU thesis."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "tiktoken>=0.7",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hallm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
