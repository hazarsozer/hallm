# Arm A0 — baseline, no sharing. Term-2 real run (NOT executed by the overnight loop).
# The four arm configs are IDENTICAL except `arm:` — this guarantees the matched-budget control.
shape: s30          # d=512, L=8, heads=8, vocab=32000, block=512  (roadmap/03-architecture.md)
arm: A0
train:
  lr: 6.0e-4
  min_lr: 6.0e-5
  warmup_steps: 200
  max_steps: 50000  # fixes tokens-seen identically across arms
  weight_decay: 0.1
  grad_clip: 1.0
  batch_size: 12
  grad_accum: 2
  dtype: bfloat16
  seed: 1337
  deterministic: true
  eval_interval: 1000
  out_dir: runs/A0
