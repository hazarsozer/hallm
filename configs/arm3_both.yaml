# Arm A3 — combined: ALBERT cross-layer AND HaLViT intra-layer simultaneously (both axes stack).
# Identical to arm0 except `arm:` (matched budget).
shape: s30
arm: A3
train:
  lr: 6.0e-4
  min_lr: 6.0e-5
  warmup_steps: 200
  max_steps: 50000
  weight_decay: 0.1
  grad_clip: 1.0
  batch_size: 12
  grad_accum: 2
  dtype: bfloat16
  seed: 1337
  deterministic: true
  eval_interval: 1000
  out_dir: runs/A3
