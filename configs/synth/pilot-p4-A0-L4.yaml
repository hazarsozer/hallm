# T-006 sizing pilot (spec 2026-09-14 §5): unshared deep reference (A0 @ 4k=4 layers, k=1),
# p-hop induction. Same recipe as pilot-p4-A0-L1.yaml except n_layer -- see that file's header.
task: p_hop_induction
task_kwargs:
  vocab_size: 256
  seq_len_margin: 4
difficulty: 4
arm: A0
model:
  n_embd: 128
  n_layer: 4
  n_head: 4
  ffn_mult: 4
  block_size: 24
train:
  max_steps: 80000
  batch_size: 64
  lr: 3.0e-3
  warmup_steps: 500
  seed: 0
  eval_interval: 16000
  eval_problems: 500
run_id: synth-p_hop_induction-L4-A0-s0
